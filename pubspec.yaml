name: cruising
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.10.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  path_provider: ^2.1.5
  window_manager: ^0.5.1
  audioplayers: ^6.1.0
  win32: ^5.11.0
  tray_manager: ^0.5.2
  uuid: ^4.5.2
  provider: ^6.1.2
  ffi: ^2.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/icon/Icon.png"
  min_sdk_android: 21 # android min sdk value
  web:
    generate: true
    image_path: "assets/images/icon/Icon.png"
    background_color: "#ffffff"
    theme_color: "#ffffff"
  windows:
    generate: true
    image_path: "assets/images/icon/Icon.png"
    icon_size: 256 # min:48, max:256, default: 256
  macos:
    generate: true
    image_path: "assets/images/icon/Icon.png"
  linux:
    generate: true
    image_path: "assets/images/icon/Icon.png"

flutter:
  uses-material-design: true
  generate: true
  
  assets:
    - assets/paper_ui/Sprites/Paper_UI_Pack/Folding_Cutout/4_Notification/
